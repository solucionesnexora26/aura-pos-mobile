name: aura_pos
description: Aura POS - Aplicación móvil de punto de venta de nivel empresarial.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Local key-value storage (preferencias)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Modelado inmutable / serialización
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Programación funcional
  fpdart: ^1.1.0

  # Hooks
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1

  # Networking (preparado para backend FastAPI)
  dio: ^5.5.0
  connectivity_plus: ^6.0.5

  # Backend central (Supabase) - sincronización offline-first
  supabase_flutter: ^2.5.0

  # Impresión
  esc_pos_utils_plus: ^2.0.4
  esc_pos_printer_plus: ^0.1.1
  print_bluetooth_thermal: ^1.1.4
  network_info_plus: ^6.0.1
  permission_handler: ^11.4.0
  image: ^4.3.0

  # Biometría / seguridad
  local_auth: ^2.3.0
  crypto: ^3.0.3

  # Escaneo de código de barras
  mobile_scanner: ^5.1.1

  # PDF / compartir / Excel
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^9.0.0
  excel: ^4.0.6
  file_picker: ^8.0.0

  # Auto-actualización in-app
  package_info_plus: ^8.0.0

  # UI utilidades
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0
  equatable: ^2.0.5

  # Logging
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Codegen
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

  # Testing
  mocktail: ^1.0.4

dependency_overrides:
  # Fork local: el plugin publicado antepone LF a writebytes y no cierra el
  # BluetoothSocket explícitamente. Este fork conserva el API Dart público.
  print_bluetooth_thermal:
    path: packages/print_bluetooth_thermal

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
